name: main

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.run_number }}
  cancel-in-progress: true

env:
  LATEST_CLICKHOUSE_VERSION: latest

jobs:
  lint:
    runs-on: ${{ vars.SELF_HOSTED_RUNNERS != 'false' && fromJSON('["self-hosted", "yc-ci"]') || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v7
    - name: "lint: isort"
      run: make isort
    - name: "lint: black"
      run: make black
    - name: "lint: codespell"
      run: make codespell
    - name: "lint: ruff"
      run: make ruff
    - name: "lint: pylint"
      run: make pylint
    - name: "lint: mypy"
      run: make mypy

  test:
    name: test (Python ${{ matrix.python }}, ClickHouse ${{ matrix.clickhouse }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
        - python: "3.10"
          clickhouse: "23.3.22.3"
          runner: yc
        - python: "3.10"
          clickhouse: "23.8.16.40"
          runner: yc
        - python: "3.10"
          clickhouse: "24.3.18.7"
          runner: yc
        - python: "3.10"
          clickhouse: "24.8.14.39"
          runner: yc
        - python: "3.10"
          clickhouse: "25.3.12.8"
          runner: yc
        - python: "3.10"
          clickhouse: "25.8.23.13"
          runner: yc
        - python: "3.10"
          clickhouse: "26.3.12.3"
          runner: yc
        - python: "3.10"
          clickhouse: "latest"
          runner: yc
        - python: "3.11"
          clickhouse: "latest"
          runner: github
        - python: "3.12"
          clickhouse: "latest"
          runner: github
        - python: "3.13"
          clickhouse: "latest"
          runner: github
        - python: "3.14"
          clickhouse: "latest"
          runner: github
    # With the repository variable SELF_HOSTED_RUNNERS = false, every job runs on GitHub-hosted runners.
    runs-on: ${{ matrix.runner == 'yc' && vars.SELF_HOSTED_RUNNERS != 'false' && fromJSON('["self-hosted", "yc-ci"]') || 'ubuntu-22.04' }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python }}
    - name: run unit tests
      run: make test-unit
    - name: run integration tests
      run: make test-integration-parallel
      # Self-hosted runners set INTEGRATION_JOBS for the size of their VM, GitHub-hosted ones take 3 from the Makefile.
      env:
        CLICKHOUSE_VERSION: ${{ matrix.clickhouse == 'latest' && env.LATEST_CLICKHOUSE_VERSION || matrix.clickhouse }}
    - name: collect runner diagnostics
      if: ${{ failure() }}
      run: |
        mkdir -p staging/ci-diagnostics
        timeout 15 docker version > staging/ci-diagnostics/docker-version.txt 2>&1 || true
        timeout 15 docker info --format 'Server={{.ServerVersion}} Storage={{.Driver}} Cgroup={{.CgroupDriver}} CPUs={{.NCPU}} Memory={{.MemTotal}} Containers={{.Containers}} Running={{.ContainersRunning}}' > staging/ci-diagnostics/docker-info.txt 2>&1 || true
        # Per-worker cleanup already saves owned container state/logs before removal.
        # Avoid listing other environments on a shared Docker daemon here.
        timeout 15 df -h . > staging/ci-diagnostics/disk-space.txt 2>&1 || true
        timeout 15 df -i . > staging/ci-diagnostics/inodes.txt 2>&1 || true
        free -m > staging/ci-diagnostics/memory.txt 2>&1 || true
        # Our GitHub-hosted jobs get a fresh VM; self-hosted daemons may be shared.
        if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
          timeout 15 sudo -n journalctl -u docker.service -u containerd.service --since '-30 min' --lines 1000 --no-pager > staging/ci-diagnostics/container-runtime.txt 2>&1 || true
        else
          printf '%s\n' 'Host-wide runtime journal omitted on self-hosted or unknown runners. Per-worker container state and logs are in integration-test-results.' > staging/ci-diagnostics/container-runtime.txt
        fi
    - uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: runner-diagnostics-py${{ matrix.python }}-clickhouse-${{ matrix.clickhouse }}-attempt-${{ github.run_attempt }}
        path: staging/ci-diagnostics/
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: integration-test-results-py${{ matrix.python }}-clickhouse-${{ matrix.clickhouse }}-attempt-${{ github.run_attempt }}
        path: staging/parallel/*/results/
        if-no-files-found: ignore
