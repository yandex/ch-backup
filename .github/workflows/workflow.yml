name: main

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.run_number }}
  cancel-in-progress: true

env:
  LATEST_CLICKHOUSE_VERSION: latest

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v7
    - name: "lint: isort"
      run: make isort
    - name: "lint: black"
      run: make black
    - name: "lint: codespell"
      run: make codespell
    - name: "lint: ruff"
      run: make ruff
    - name: "lint: pylint"
      run: make pylint
    - name: "lint: mypy"
      run: make mypy

  test:
    name: test (Python ${{ matrix.python }}, ClickHouse ${{ matrix.clickhouse }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
        - python: "3.10"
          clickhouse: "23.3.22.3"
          runner: yc
        - python: "3.10"
          clickhouse: "23.8.16.40"
          runner: yc
        - python: "3.10"
          clickhouse: "24.3.18.7"
          runner: yc
        - python: "3.10"
          clickhouse: "24.8.14.39"
          runner: yc
        - python: "3.10"
          clickhouse: "25.3.12.8"
          runner: yc
        - python: "3.10"
          clickhouse: "25.8.23.13"
          runner: yc
        - python: "3.10"
          clickhouse: "26.3.12.3"
          runner: yc
        - python: "3.10"
          clickhouse: "latest"
          runner: yc
        - python: "3.11"
          clickhouse: "latest"
          runner: github
        - python: "3.12"
          clickhouse: "latest"
          runner: github
        - python: "3.13"
          clickhouse: "latest"
          runner: github
        - python: "3.14"
          clickhouse: "latest"
          runner: github
    # With the repository variable SELF_HOSTED_RUNNERS = false, every job runs on GitHub-hosted runners.
    runs-on: ${{ matrix.runner == 'yc' && vars.SELF_HOSTED_RUNNERS != 'false' && fromJSON('["self-hosted", "yc-ci"]') || 'ubuntu-22.04' }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python }}
    - name: run unit tests
      run: make test-unit
    - name: run integration tests
      run: make test-integration-parallel
      env:
        INTEGRATION_JOBS: '3'
        CLICKHOUSE_VERSION: ${{ matrix.clickhouse == 'latest' && env.LATEST_CLICKHOUSE_VERSION || matrix.clickhouse }}
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: integration-test-results-py${{ matrix.python }}-clickhouse-${{ matrix.clickhouse }}-attempt-${{ github.run_attempt }}
        path: staging/parallel/*/results/
        if-no-files-found: ignore
