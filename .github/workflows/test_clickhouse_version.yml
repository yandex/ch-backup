name: test_clickhouse_version

run-name: ${{github.workflow}}_${{ inputs.clickhouse_version }}_${{ inputs.id || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      clickhouse_version:
        description: 'ClickHouse version'
        required: true
        type: string
      id:
        description: 'Run identifier'
        required: false
        type: string
        default: ""

jobs:
  test_integration:
    # With the repository variable SELF_HOSTED_RUNNERS = false, every job runs on GitHub-hosted runners.
    runs-on: ${{ vars.SELF_HOSTED_RUNNERS != 'false' && fromJSON('["self-hosted", "yc-ci"]') || 'ubuntu-latest' }}
    env:
      CLICKHOUSE_VERSION: ${{ inputs.clickhouse_version }}
    steps:
      - name: check the ClickHouse version
        run: |
          if [[ ! $CLICKHOUSE_VERSION =~ ^([0-9]+(\.[0-9]+){0,3}|latest)$ ]]; then
            echo "Invalid ClickHouse version: $CLICKHOUSE_VERSION" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: run integration tests
        run: make test-integration
